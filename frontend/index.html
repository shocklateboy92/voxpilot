<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: the virtual keyboard shrinks the
         layout viewport (and thus dvh/ICB) instead of only the visual viewport.
         Without it, Chrome 108+ defaults to resizes-visual, which leaves the
         full-height layout in place and pans the visual viewport around it --
         letting the user drag non-scrolling areas (header, input bar) and
         desync the layout. Not supported on iOS/Safari, which keeps the
         panning behaviour. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="theme-color"
      content="#0f1117"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f8f9fa"
      media="(prefers-color-scheme: light)"
    />
    <title>VoxPilot</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
